[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencedesk"
version = "1.0.0"
description = "Evidence-first bilingual support retrieval with a deployable API and evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Isaac Yanney"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
neural = ["sentence-transformers>=6.1,<7"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
evidencedesk-evaluate = "evidencedesk.evaluate:main"
evidencedesk-index = "evidencedesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidencedesk = ["static/*", "data/runbooks/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

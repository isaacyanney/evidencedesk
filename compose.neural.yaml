# Use with: docker compose -f compose.yaml -f compose.neural.yaml up --build
services:
  evidencedesk:
    build:
      target: neural
    environment:
      RETRIEVAL_BACKEND: hybrid
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:?Set an exact Hugging Face model commit SHA}
      HF_HOME: /home/app/.cache/huggingface
      OMP_NUM_THREADS: 2
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - model-cache:/home/app/.cache/huggingface
    mem_limit: 3g
    healthcheck:
      start_period: 300s
      retries: 10
volumes:
  model-cache:

name: Validate and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.lock && pip install -e ".[dev]"
      - run: make lint test evaluate
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-and-wheel-py${{ matrix.python-version }}
          path: |
            evaluation/results.json
            dist/*
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target base -t evidencedesk:ci .
      - name: Test container readiness and authenticated inference
        run: |
          docker run -d --name evidence -p 8000:8000 -e API_KEY=ci-only-random-placeholder-32-characters evidencedesk:ci
          trap 'docker logs evidence; docker rm -f evidence' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/corpus)" = 401
          curl -fsS -H 'X-API-Key: ci-only-random-placeholder-32-characters' -H 'Content-Type: application/json' -d '{"question":"My VPN will not connect but websites load","source_language":"en"}' http://127.0.0.1:8000/api/query | python -c 'import json,sys; d=json.load(sys.stdin); assert d["decision"]=="answer" and d["citations"]'
